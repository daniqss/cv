name: Deploy CV to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build CV
        run: nix build .

      - name: Prepare site
        run: |
          mkdir -p public
          cp -L result/cv.pdf public/cv.pdf
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>CV — Daniel Queijo Seoane</title>
              <style>
                html, body { margin: 0; height: 100%; }
                object { display: block; width: 100%; height: 100%; border: 0; }
              </style>
            </head>
            <body>
              <object data="cv.pdf" type="application/pdf">
                <p>Tu navegador no puede mostrar el PDF.
                  <a href="cv.pdf">Ábrelo o descárgalo aquí</a>.</p>
              </object>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
