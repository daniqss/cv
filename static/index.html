<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV — Daniel Queijo Seoane</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      object {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #pdf-fallback-message {
        display: none;
        font-family: system-ui, sans-serif;
        padding: 2rem;
        line-height: 1.6;
      }
      body.no-pdf-viewer object {
        display: none;
      }
      body.no-pdf-viewer #pdf-fallback-message {
        display: block;
      }
    </style>
  </head>
  <body>
    <object id="pdf-object" type="application/pdf" data="cv-en.pdf"></object>

    <p id="pdf-fallback-message">
      <span id="pdf-fallback-text"></span>
      <a id="pdf-fallback" href="cv-en.pdf"></a>
    </p>

    <script>
      // supported languages and their fallback messages
      const defaultLanguage = {
        code: "en",
        fallbackMessage: "Your browser cannot embed PDF.",
        fallbackLinkText: "Open it here",
      };
      const supportedLanguages = [
        defaultLanguage,
        {
          code: "es",
          fallbackMessage: "Tu navegador no puede embeber el PDF.",
          fallbackLinkText: "Ábrelo aquí",
        },
        {
          code: "gl",
          fallbackMessage: "O teu navegador non pode embeber o PDF.",
          fallbackLinkText: "Ábreo aquí",
        },
      ];

      // get client wanted language
      const requested = (navigator.language || defaultLanguage.code)
        .slice(0, 2)
        .toLowerCase();
      const language =
        supportedLanguages.find((lang) => lang.code === requested) ||
        defaultLanguage;
      const file = `cv-${language.code}.pdf`;

      // mobile browsers have no inline pdf viewer and don't trigger the
      // <object> fallback either, so we have to ask instead of waiting
      const canEmbedPdf = () => {
        if (typeof navigator.pdfViewerEnabled === "boolean")
          return navigator.pdfViewerEnabled;
        // ipados reports itself as macintosh
        const touchMac =
          /Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
        return (
          !/Android|iPhone|iPod|iPad/i.test(navigator.userAgent) && !touchMac
        );
      };

      // set the language and pdf file in the html
      document.documentElement.lang = language.code;
      document.getElementById("pdf-object").data = file;
      document.getElementById("pdf-fallback-text").textContent =
        language.fallbackMessage;

      const link = document.getElementById("pdf-fallback");
      link.href = file;
      link.textContent = language.fallbackLinkText;

      // no inline viewer, show the link instead of an empty box
      if (!canEmbedPdf()) document.body.classList.add("no-pdf-viewer");
    </script>
  </body>
</html>
